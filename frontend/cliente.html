<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMG Merch - Meu Perfil</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="/img/logo.png" alt="SMG Merch Logo" class="logo-img">
                <h1>SMG MERCH</h1>
            </div>
            <nav class="nav-buttons">
                <button class="btn-secundario" onclick="window.location.href='/'">Quem Somos</button>
                <button id="lojaBtn" class="btn-secundario" onclick="window.location.href='loja.html'">Loja</button>
                <button id="logoutBtn" class="btn-secundario">Sair</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="cliente-container">
            <h2>Meu Perfil</h2>

            <!-- Dados do Cliente -->
            <section class="dados-section">
                <h3>Seus Dados</h3>
                <div class="dados-display">
                    <div class="dado">
                        <label>Nome de Usuário:</label>
                        <p id="usuarioDisplay">-</p>
                    </div>
                    <div class="dado">
                        <label>CPF:</label>
                        <p id="cpfDisplay">-</p>
                    </div>
                    <div class="dado">
                        <label>E-mail:</label>
                        <p id="emailDisplay">-</p>
                    </div>
                </div>
            </section>

            <!-- Editar E-mail -->
            <section class="edit-section">
                <h3>Alterar E-mail</h3>
                <form id="editEmailForm">
                    <div class="form-group">
                        <label for="novoEmail">Novo E-mail:</label>
                        <input 
                            type="email" 
                            id="novoEmail" 
                            placeholder="seu.novo.email@exemplo.com" 
                            required
                        >
                    </div>
                    <button type="submit" class="btn-primary">Alterar E-mail</button>
                    <p class="form-message" id="editEmailMessage"></p>
                </form>
            </section>

            <!-- Alterar Senha -->
            <section class="edit-section">
                <h3>Alterar Senha</h3>
                <form id="editSenhaForm">
                    <div class="form-group">
                        <label for="senhaAtual">Senha Atual:</label>
                        <input 
                            type="password" 
                            id="senhaAtual" 
                            placeholder="Digite sua senha atual" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="novaSenha">Nova Senha:</label>
                        <input 
                            type="password" 
                            id="novaSenha" 
                            placeholder="Digite a nova senha (mínimo 6 caracteres)" 
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Nova Senha:</label>
                        <input 
                            type="password" 
                            id="confirmarSenha" 
                            placeholder="Confirme a nova senha" 
                            required
                        >
                    </div>
                    <button type="submit" class="btn-primary">Alterar Senha</button>
                    <p class="form-message" id="editSenhaMessage"></p>
                </form>
            </section>

            <!-- Voltar para Loja -->
            <section class="action-section">
                <button class="btn-secundario" onclick="window.location.href='loja.html'">Voltar para Loja</button>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 SMG Merch. Todos os direitos reservados.</p>
    </footer>

    <style>
        .cliente-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cliente-container h2 {
            font-size: 32px;
            margin-bottom: 40px;
            text-align: center;
            color: var(--primary-black);
        }

        .dados-section,
        .edit-section {
            background: var(--secondary-gray);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .dados-section h3,
        .edit-section h3 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--primary-black);
            border-bottom: 2px solid var(--primary-black);
            padding-bottom: 10px;
        }

        .dados-display {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .dado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--primary-white);
            border-radius: 5px;
            border-left: 4px solid var(--primary-black);
        }

        .dado label {
            font-weight: 600;
            color: var(--primary-black);
        }

        .dado p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-black);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-black);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);
        }

        .form-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }

        .form-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .form-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .action-section {
            text-align: center;
            margin-top: 40px;
        }

        .btn-primary,
        .btn-secundario {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary-black);
            color: var(--primary-white);
            width: 100%;
        }

        .btn-primary:hover {
            background: #333;
        }

        .btn-secundario {
            background: var(--border-color);
            color: var(--primary-black);
        }

        .btn-secundario:hover {
            background: #ddd;
        }

        @media (max-width: 768px) {
            .cliente-container {
                margin: 20px auto;
            }

            .cliente-container h2 {
                font-size: 24px;
                margin-bottom: 30px;
            }

            .dados-section,
            .edit-section {
                padding: 20px;
                margin-bottom: 20px;
            }

            .dado {
                flex-direction: column;
                align-items: flex-start;
            }

            .dado p {
                margin-top: 8px;
            }
        }
    </style>

    <script src="/js/cliente.js"></script>
</body>
</html>
